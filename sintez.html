<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Realtime Speech, Translate & Voice</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; max-width: 800px; margin: auto; }
        .box { background: white; padding: 15px; border: 1px solid #ccc; border-radius: 5px; margin-top: 10px; height: 120px; overflow-y: auto; font-size: 1.2em; white-space: pre-wrap; line-height: 1.5; }
        #original { color: #333; }
        #translated { color: #1a73e8; font-weight: bold; }
        .controls { margin-top: 15px; margin-bottom: 15px; background: #eee; padding: 15px; border-radius: 8px; }
        .controls div { margin-bottom: 10px; }
        .status { color: gray; font-style: italic; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Голосовой переводчик с авто-финализацией и озвучкой</h2>
    
    <div class="controls">
        <div>
            <label for="langSelect">Язык речи:</label>
            <select id="langSelect">
                <option value="en-US">Английский (перевод на RU)</option>
                <option value="ru-RU">Русский (перевод на EN)</option>
                <option value="uk-UA">Украинский (перевод на EN)</option>
            </select>
        </div>
        <div>
            <label for="forceTimeInput">Авто-разрез речи (сек): </label>
            <input type="number" id="forceTimeInput" value="3" step="0.5" min="1" max="10" style="width: 60px;">
        </div>
        <div>
            <label>
                <input type="checkbox" id="voiceToggle" checked> Включить озвучку перевода
            </label>
        </div>
    </div>

    <p class="status" id="status">Запуск...</p>

    <h3 id="orig-title">Оригинал:</h3>
    <div id="original" class="box"></div>

    <h3 id="trans-title">Перевод:</h3>
    <div id="translated" class="box"></div>

    <script>
        const langSelect = document.getElementById('langSelect');
        const forceTimeInput = document.getElementById('forceTimeInput');
        const voiceToggle = document.getElementById('voiceToggle');
        const statusEl = document.getElementById('status');
        const originalEl = document.getElementById('original');
        const translatedEl = document.getElementById('translated');
        const origTitle = document.getElementById('orig-title');
        const transTitle = document.getElementById('trans-title');

        let fullOriginalHistory = "";
        let fullTranslatedHistory = "";
        let currentInterimBuffer = "";
        let forceTimer = null;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusEl.innerText = "Ошибка: Ваш браузер не поддерживает распознавание речи. Используйте Google Chrome.";
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            function updateLanguageSettings() {
                const selectedLang = langSelect.value;
                recognition.lang = selectedLang;
                localStorage.setItem('selectedLang', selectedLang);

                if (selectedLang === 'en-US') {
                    origTitle.innerText = "Оригинал (EN):";
                    transTitle.innerText = "Перевод (RU):";
                } else {
                    origTitle.innerText = "Оригинал (" + selectedLang.split('-')[0].toUpperCase() + "):";
                    transTitle.innerText = "Перевод (EN):";
                }
            }

            langSelect.addEventListener('change', () => {
                updateLanguageSettings();
                recognition.stop();
                resetState();
                window.speechSynthesis.cancel();
            });

            function resetState() {
                fullOriginalHistory = "";
                fullTranslatedHistory = "";
                currentInterimBuffer = "";
                originalEl.innerText = "";
                translatedEl.innerText = "";
                clearTimeout(forceTimer);
            }

            async function fetchTranslation(text) {
                if (!text.trim()) return "";
                const sourceLang = recognition.lang.split('-')[0];
                const targetLang = (sourceLang === 'en') ? 'ru' : 'en';

                try {
                    let response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
                    let data = await response.json();
                    if (data && data[0]) {
                        return data[0].map(item => item[0]).join('');
                    }
                } catch (e) {
                    console.error("Ошибка перевода:", e);
                }
                return "";
            }

            function speakText(text) {
                if (!voiceToggle.checked || !text.trim()) return;
                
                const utterance = new SpeechSynthesisUtterance(text);
                const sourceLang = recognition.lang.split('-')[0];
                const targetLang = (sourceLang === 'en') ? 'ru' : 'en';
                
                utterance.lang = (targetLang === 'ru') ? 'ru-RU' : 'en-US';
                utterance.rate = 1.0;

                window.speechSynthesis.speak(utterance);
            }

            // Функция фиксации и отправки накопившегося куска (вызывается по паузе или по таймеру)
            async function commitChunk(textToCommit) {
                if (!textToCommit.trim()) return;

                fullOriginalHistory += textToCommit + " ";
                originalEl.innerText = fullOriginalHistory;
                originalEl.scrollTop = originalEl.scrollHeight;

                let translatedChunk = await fetchTranslation(textToCommit);
                if (translatedChunk) {
                    fullTranslatedHistory += translatedChunk + " \n";
                    translatedEl.innerText = fullTranslatedHistory;
                    translatedEl.scrollTop = translatedEl.scrollHeight;

                    speakText(translatedChunk);
                }
            }

            // Перезапуск таймера принудительной финализации
            function resetForceTimer() {
                clearTimeout(forceTimer);
                const seconds = parseFloat(forceTimeInput.value) || 3;
                
                forceTimer = setTimeout(async () => {
                    if (currentInterimBuffer.trim()) {
                        let chunkToForce = currentInterimBuffer;
                        currentInterimBuffer = "";
                        await commitChunk(chunkToForce);
                    }
                }, seconds * 1000);
            }

            recognition.onstart = () => {
                statusEl.innerText = "🎤 Слушаю и перевожу: " + langSelect.options[langSelect.selectedIndex].text;
            };

            recognition.onresult = async (event) => {
                let interimText = "";
                let finalChunk = "";

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalChunk += transcript + " ";
                    } else {
                        interimText += transcript;
                    }
                }

                // Если браузер сам поймал паузу (isFinal)
                if (finalChunk.trim()) {
                    clearTimeout(forceTimer);
                    currentInterimBuffer = ""; // сбрасываем буфер
                    await commitChunk(finalChunk);
                } else if (interimText.trim()) {
                    // Человек продолжает говорить без пауз
                    currentInterimBuffer = interimText;
                    resetForceTimer(); // обновляем таймер принудительного среза
                }
            };

            recognition.onerror = (e) => {
                statusEl.innerText = "Ошибка распознавания: " + e.error;
            };

            recognition.onend = () => { 
                setTimeout(() => { 
                    try { recognition.start(); } catch(e) {} 
                }, 300); 
            };
            
            langSelect.value = localStorage.getItem('selectedLang') || 'en-US';
            updateLanguageSettings();
            recognition.start();
        }
    </script>
</body>
</html>
