<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Realtime Speech & Translate</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; max-width: 800px; margin: auto; }
        .box { background: white; padding: 15px; border: 1px solid #ccc; border-radius: 5px; margin-top: 10px; min-height: 80px; max-height: 250px; overflow-y: auto; font-size: 1.2em; white-space: pre-wrap; line-height: 1.5; }
        #original { color: #333; }
        #translated { color: #1a73e8; font-weight: bold; }
        .controls { margin-top: 15px; margin-bottom: 15px; background: #eee; padding: 15px; border-radius: 8px; }
        .controls div { margin-bottom: 10px; }
        .status { color: gray; font-style: italic; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Голосовой переводчик</h2>
    
    <div class="controls">
        <div>
            <label for="langSelect">Язык речи:</label>
            <select id="langSelect">
                <option value="en-US">Английский (перевод на RU)</option>
                <option value="ru-RU">Русский (перевод на EN)</option>
                <option value="uk-UA">Украинский (перевод на EN)</option>
            </select>
        </div>
        <div>
            <label for="delayInput">Задержка перевода (мс): </label>
            <input type="number" id="delayInput" value="500" step="50" min="50" max="2000" style="width: 70px;">
            <input type="range" id="delayRange" value="500" step="50" min="50" max="2000">
        </div>
    </div>

    <p class="status" id="status">Запуск...</p>

    <h3 id="orig-title">Оригинал:</h3>
    <div id="original" class="box"></div>

    <h3 id="trans-title">Перевод:</h3>
    <div id="translated" class="box"></div>

    <script>
        const langSelect = document.getElementById('langSelect');
        const delayInput = document.getElementById('delayInput');
        const delayRange = document.getElementById('delayRange');
        const statusEl = document.getElementById('status');
        const originalEl = document.getElementById('original');
        const translatedEl = document.getElementById('translated');
        const origTitle = document.getElementById('orig-title');
        const transTitle = document.getElementById('trans-title');

        let translateTimeout = null;
        let fullOriginalText = "";
        let fullTranslatedText = "";
        let currentAbortController = null;

        delayInput.addEventListener('input', () => { delayRange.value = delayInput.value; });
        delayRange.addEventListener('input', () => { delayInput.value = delayRange.value; });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusEl.innerText = "Ошибка: Ваш браузер не поддерживает распознавание речи. Используйте Google Chrome.";
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            function updateLanguageSettings() {
                const selectedLang = langSelect.value;
                recognition.lang = selectedLang;
                localStorage.setItem('selectedLang', selectedLang);

                if (selectedLang === 'en-US') {
                    origTitle.innerText = "Оригинал (EN):";
                    transTitle.innerText = "Перевод (RU):";
                } else {
                    origTitle.innerText = "Оригинал (" + selectedLang.split('-')[0].toUpperCase() + "):";
                    transTitle.innerText = "Перевод (EN):";
                }
            }

            langSelect.addEventListener('change', () => {
                updateLanguageSettings();
                recognition.stop();
                fullOriginalText = "";
                fullTranslatedText = "";
                originalEl.innerText = "";
                translatedEl.innerText = "";
            });

            async function sendTranslation(text) {
                if (!text.trim()) return "";
                if (currentAbortController) currentAbortController.abort();
                currentAbortController = new AbortController();

                const sourceLang = recognition.lang.split('-')[0];
                const targetLang = (sourceLang === 'en') ? 'ru' : 'en';

                try {
                    let response = await fetch(
                        `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`,
                        { signal: currentAbortController.signal }
                    );
                    let data = await response.json();
                    if (data && data[0]) {
                        return data[0].map(item => item[0]).join('');
                    }
                } catch (e) {
                    if (e.name !== 'AbortError') console.error("Ошибка перевода:", e);
                }
                return "";
            }

            recognition.onstart = () => {
                statusEl.innerText = "🎤 Слушаю: " + langSelect.options[langSelect.selectedIndex].text;
            };

            recognition.onresult = (event) => {
                let currentInterim = '';
                let currentFinal = '';

                // Читаем только свежие результаты текущей сессии
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        currentFinal += event.results[i][0].transcript + ' ';
                    } else {
                        currentInterim += event.results[i][0].transcript;
                    }
                }

                // Если браузер зафиксировал кусок речи как final — сразу добавляем в историю
                if (currentFinal) {
                    fullOriginalText += currentFinal;
                    
                    // Переводим финальный кусок и добавляем к переводу
                    sendTranslation(currentFinal).then(translatedChunk => {
                        fullTranslatedText += translatedChunk + ' ';
                        translatedEl.innerText = fullTranslatedText;
                        originalEl.innerText = fullOriginalText;
                        
                        // Автопрокрутка вниз блоков
                        originalEl.scrollTop = originalEl.scrollHeight;
                        translatedEl.scrollTop = translatedEl.scrollHeight;
                    });
                } else {
                    // Пока человек говорит (interim), показываем с учетом задержки
                    originalEl.innerText = fullOriginalText + currentInterim;

                    clearTimeout(translateTimeout);
                    translateTimeout = setTimeout(async () => {
                        if (currentInterim.trim()) {
                            let interimTranslation = await sendTranslation(currentInterim);
                            translatedEl.innerText = fullTranslatedText + interimTranslation;
                        }
                    }, parseInt(delayInput.value));
                }
            };

            recognition.onerror = (e) => {
                statusEl.innerText = "Ошибка распознавания: " + e.error;
            };

            recognition.onend = () => { 
                setTimeout(() => { 
                    try { recognition.start(); } catch(e) {} 
                }, 300); 
            };
            
            langSelect.value = localStorage.getItem('selectedLang') || 'en-US';
            updateLanguageSettings();
            recognition.start();
        }
    </script>
</body>
</html>
