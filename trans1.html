<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Realtime Speech & Translate</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; max-width: 800px; margin: auto; }
        .box { background: white; padding: 15px; border: 1px solid #ccc; border-radius: 5px; margin-top: 10px; min-height: 80px; font-size: 1.2em; white-space: pre-wrap; line-height: 1.5; }
        #original { color: #333; }
        #translated { color: #1a73e8; font-weight: bold; }
        .controls { margin-top: 15px; margin-bottom: 15px; background: #eee; padding: 15px; border-radius: 8px; }
        .controls div { margin-bottom: 10px; }
        .status { color: gray; font-style: italic; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Голосовой переводчик</h2>
    
    <div class="controls">
        <div>
            <label for="langSelect">Язык речи:</label>
            <select id="langSelect">
                <option value="en-US">Английский (перевод на RU)</option>
                <option value="ru-RU">Русский (перевод на EN)</option>
                <option value="uk-UA">Украинский (перевод на EN)</option>
            </select>
        </div>
        <div>
            <label for="delayInput">Задержка перевода (мс): </label>
            <input type="number" id="delayInput" value="500" step="50" min="50" max="2000" style="width: 70px;">
            <input type="range" id="delayRange" value="500" step="50" min="50" max="2000">
        </div>
    </div>

    <p class="status" id="status">Запуск...</p>

    <h3 id="orig-title">Оригинал:</h3>
    <div id="original" class="box"></div>

    <h3 id="trans-title">Перевод:</h3>
    <div id="translated" class="box"></div>

    <script>
        const langSelect = document.getElementById('langSelect');
        const delayInput = document.getElementById('delayInput');
        const delayRange = document.getElementById('delayRange');
        const statusEl = document.getElementById('status');
        const originalEl = document.getElementById('original');
        const translatedEl = document.getElementById('translated');
        const origTitle = document.getElementById('orig-title');
        const transTitle = document.getElementById('trans-title');

        let translateTimeout = null;
        let fullOriginalText = "";
        let fullTranslatedText = "";

        // Синхронизация ползунка и поля ввода
        delayInput.addEventListener('input', () => { delayRange.value = delayInput.value; });
        delayRange.addEventListener('input', () => { delayInput.value = delayRange.value; });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;

        function updateLanguageSettings() {
            const selectedLang = langSelect.value;
            recognition.lang = selectedLang;
            localStorage.setItem('selectedLang', selectedLang);

            if (selectedLang === 'en-US') {
                origTitle.innerText = "Оригинал (EN):";
                transTitle.innerText = "Перевод (RU):";
            } else {
                origTitle.innerText = "Оригинал (" + selectedLang.split('-')[0].toUpperCase() + "):";
                transTitle.innerText = "Перевод (EN):";
            }
        }

        langSelect.addEventListener('change', () => {
            updateLanguageSettings();
            recognition.stop();
            fullOriginalText = "";
            fullTranslatedText = "";
            originalEl.innerText = "";
            translatedEl.innerText = "";
        });

        async function translateText(text) {
            if (!text.trim()) return "";
            const sourceLang = recognition.lang.split('-')[0];
            const targetLang = (sourceLang === 'en') ? 'ru' : 'en';
            try {
                let response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
                let data = await response.json();
                return data && data[0] ? data[0].map(item => item[0]).join('') : "";
            } catch (e) { return "..."; }
        }

        recognition.onresult = async (event) => {
            let interim = '';
            let final = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    final += event.results[i][0].transcript + ' \n';
                } else {
                    interim += event.results[i][0].transcript;
                }
            }

            originalEl.innerText = fullOriginalText + final + interim;

            clearTimeout(translateTimeout);
            translateTimeout = setTimeout(async () => {
                const translation = await translateText(final + interim);
                translatedEl.innerText = fullTranslatedText + translation;
                
                // Если фраза финальная, фиксируем её в истории
                if (final) {
                    fullOriginalText += final;
                    fullTranslatedText += translation;
                }
            }, parseInt(delayInput.value));
        };

        recognition.onend = () => { setTimeout(() => { try { recognition.start(); } catch(e) {} }, 300); };
        
        // Init
        langSelect.value = localStorage.getItem('selectedLang') || 'en-US';
        updateLanguageSettings();
        recognition.start();
    </script>
</body>
</html>
