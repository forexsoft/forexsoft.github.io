<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Realtime Speech & Translate</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; max-width: 800px; margin: auto; }
        .box { background: white; padding: 15px; border: 1px solid #ccc; border-radius: 5px; margin-top: 15px; min-height: 80px; font-size: 1.2em; white-space: pre-wrap; line-height: 1.5; }
        #original { color: #333; }
        #translated { color: #1a73e8; font-weight: bold; }
        .controls { margin-top: 15px; margin-bottom: 15px; }
        .controls label { font-weight: bold; margin-right: 10px; }
        .controls select { padding: 5px 10px; font-size: 1em; }
        .status { color: gray; font-style: italic; }
    </style>
</head>
<body>

    <h2>Голосовой переводчик в реальном времени</h2>
    
    <div class="controls">
        <label for="langSelect">Язык речи (звука):</label>
        <select id="langSelect">
            <option value="en-US">Английский (перевод на RU)</option>
            <option value="ru-RU">Русский (перевод на EN)</option>
            <option value="uk-UA">Украинский (перевод на EN)</option>
        </select>
    </div>

    <p class="status" id="status">Нажмите разрешить микрофон...</p>

    <h3 id="orig-title">Оригинал (EN):</h3>
    <div id="original" class="box"></div>

    <h3 id="trans-title">Перевод (RU):</h3>
    <div id="translated" class="box"></div>

    <script>
        const statusEl = document.getElementById('status');
        const originalEl = document.getElementById('original');
        const translatedEl = document.getElementById('translated');
        const langSelect = document.getElementById('langSelect');
        const origTitle = document.getElementById('orig-title');
        const transTitle = document.getElementById('trans-title');

        // Восстанавливаем выбранный язык из памяти браузера
        const savedLang = localStorage.getItem('selectedLang') || 'en-US';
        langSelect.value = savedLang;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusEl.innerText = "Ошибка: Ваш браузер не поддерживает распознавание речи. Используйте Google Chrome.";
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            let fullOriginalText = "";
            let fullTranslatedText = "";

            function updateLanguageSettings() {
                const selectedLang = langSelect.value;
                recognition.lang = selectedLang;
                localStorage.setItem('selectedLang', selectedLang);

                if (selectedLang === 'en-US') {
                    origTitle.innerText = "Оригинал (EN):";
                    transTitle.innerText = "Перевод (RU):";
                } else if (selectedLang === 'ru-RU') {
                    origTitle.innerText = "Оригинал (RU):";
                    transTitle.innerText = "Перевод (EN):";
                } else if (selectedLang === 'uk-UA') {
                    origTitle.innerText = "Оригинал (UK):";
                    transTitle.innerText = "Перевод (EN):";
                }
            }

            // При изменении языка в списке
            langSelect.addEventListener('change', () => {
                updateLanguageSettings();
                recognition.stop(); // Останавливаем текущую сессию, чтобы recognition подхватил новый язык при перезапуске
                
                // Очищаем экраны при смене языка
                fullOriginalText = "";
                fullTranslatedText = "";
                originalEl.innerText = "";
                translatedEl.innerText = "";
            });

            // Первоначальная установка языка
            updateLanguageSettings();

            recognition.onstart = () => {
                statusEl.innerText = "🎤 Слушаю: " + langSelect.options[langSelect.selectedIndex].text;
            };

            recognition.onresult = async (event) => {
                let interimTranscript = '';
                let currentFinal = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const text = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        currentFinal += text + ' \n'; // Пауза в речи — фиксируем фразу и переносим строку
                    } else {
                        interimTranscript += text;
                    }
                }

                if (currentFinal) {
                    fullOriginalText += currentFinal;
                    
                    const sourceLang = recognition.lang.split('-')[0];
                    const targetLang = (sourceLang === 'en') ? 'ru' : 'en';

                    try {
                        let response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(currentFinal.trim())}`);
                        let data = await response.json();
                        if (data && data[0]) {
                            let translatedChunk = data[0].map(item => item[0]).join('') + ' \n';
                            fullTranslatedText += translatedChunk;
                        }
                    } catch (e) {
                        console.error("Ошибка перевода:", e);
                    }
                }

                originalEl.innerText = fullOriginalText + interimTranscript;
                translatedEl.innerText = fullTranslatedText;
            };

            recognition.onerror = (e) => {
                statusEl.innerText = "Ошибка распознавания: " + e.error;
            };

            recognition.onend = () => {
                setTimeout(() => { 
                    try {
                        recognition.start(); 
                    } catch (err) {
                        // Игнорируем ошибку, если сессия уже активна
                    }
                }, 300);
            };

            recognition.start();
        }
    </script>
</body>
</html>
