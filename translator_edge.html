<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Realtime Smooth Interview Translation</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; max-width: 800px; margin: auto; }
        .box { background: white; padding: 15px; border: 1px solid #ccc; border-radius: 5px; margin-top: 10px; height: 70px; overflow-y: auto; font-size: 1.2em; white-space: pre-wrap; line-height: 1.5; }
        #original { color: #333; }
        #translated { color: #1a73e8; font-weight: bold; }
        .controls { margin-top: 15px; margin-bottom: 15px; background: #eee; padding: 15px; border-radius: 8px; }
        .controls div { margin-bottom: 10px; }
        .status { color: gray; font-style: italic; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Синхронный перевод интервью (без повторов)</h2>
    
    <div class="controls">
        <div>
            <label for="langSelect">Направление:</label>
            <select id="langSelect">
                <option value="en-ru">Английский ➔ Русский (озвучка RU)</option>
                <option value="ru-en">Русский ➔ Английский (озвучка EN)</option>
                <option value="uk-en">Украинский ➔ Английский (озвучка EN)</option>
                <option value="en-uk">Английский ➔ Украинский (озвучка UK)</option>
            </select>
        </div>
        <div>
            <label for="intervalInput">Интервал блока (сек): </label>
            <input type="number" id="intervalInput" value="3" step="0.5" min="1" max="10" style="width: 60px;">
        </div>
        <div>
            <label>
                <input type="checkbox" id="voiceToggle" checked> Живая озвучка Edge
            </label>
        </div>
    </div>

    <p class="status" id="status">Запуск...</p>

    <h3 id="orig-title">Текущий оригинал:</h3>
    <div id="original" class="box"></div>

    <h3 id="trans-title">Текущий перевод:</h3>
    <div id="translated" class="box"></div>

    <script>
        const langSelect = document.getElementById('langSelect');
        const intervalInput = document.getElementById('intervalInput');
        const voiceToggle = document.getElementById('voiceToggle');
        const statusEl = document.getElementById('status');
        const originalEl = document.getElementById('original');
        const translatedEl = document.getElementById('translated');
        const origTitle = document.getElementById('orig-title');
        const transTitle = document.getElementById('trans-title');

        let rawSpeechBuffer = ""; // Буфер для накопления речи за 3 секунды
        let pushTimer = null;
        let audioQueue = [];
        let isPlaying = false;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusEl.innerText = "Ошибка: Ваш браузер не поддерживает распознавание речи. Используйте Google Chrome.";
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            function getLangs() {
                const val = langSelect.value;
                const parts = val.split('-');
                return { source: parts[0], target: parts[1] };
            }

            function updateUI() {
                const { source, target } = getLangs();
                const map = { en: 'EN', ru: 'RU', uk: 'UK' };
                origTitle.innerText = `Текущий оригинал (${map[source]}):`;
                transTitle.innerText = `Текущий перевод (${map[target]}):`;
                
                const speechLangMap = { en: 'en-US', ru: 'ru-RU', uk: 'uk-UA' };
                recognition.lang = speechLangMap[source];
            }

            langSelect.addEventListener('change', () => {
                updateUI();
                localStorage.setItem('selectedDirection', langSelect.value);
                recognition.stop();
                resetState();
            });

            function resetState() {
                rawSpeechBuffer = "";
                originalEl.innerText = "";
                translatedEl.innerText = "";
                audioQueue = [];
                isPlaying = false;
                window.speechSynthesis.cancel();
                clearInterval(pushTimer);
                startPushTimer();
            }

            async function fetchTranslation(text) {
                if (!text.trim()) return "";
                const { source, target } = getLangs();

                try {
                    let response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${source}&tl=${target}&dt=t&q=${encodeURIComponent(text)}`);
                    let data = await response.json();
                    if (data && data[0]) {
                        return data[0].map(item => item[0]).join('');
                    }
                } catch (e) {
                    console.error("Ошибка перевода:", e);
                }
                return "";
            }

            // Озвучка через локальный Edge-TTS сервер
            async function playEdgeVoice(text) {
                if (!voiceToggle.checked || !text.trim()) return;
                const { target } = getLangs();

                audioQueue.push({ text, lang: target });
                processAudioQueue();
            }

            async function processAudioQueue() {
                if (isPlaying || audioQueue.length === 0) return;
                isPlaying = true;
                const item = audioQueue.shift();

                try {
                    let response = await fetch(`http://127.0.0.1:8000/speak?text=${encodeURIComponent(item.text)}&lang=${item.lang}`);
                    if (response.ok) {
                        let blob = await response.blob();
                        let audioUrl = URL.createObjectURL(blob);
                        let audio = new Audio(audioUrl);
                        
                        await new Promise((resolve) => {
                            audio.onended = resolve;
                            audio.onerror = resolve;
                            audio.play().catch(resolve);
                        });
                    }
                } catch (e) {
                    console.error("Ошибка связи с Edge-TTS сервером:", e);
                }

                isPlaying = false;
                processAudioQueue();
            }

            // Каждые X секунд забираем накопленное, переводим, озвучиваем и ПОЛНОСТЬЮ СТИРАЕМ
            async function processAndClearBlock() {
                if (!rawSpeechBuffer.trim()) {
                    originalEl.innerText = "";
                    translatedEl.innerText = "";
                    return;
                }

                let blockToProcess = rawSpeechBuffer.trim();
                rawSpeechBuffer = ""; // Сбрасываем буфер, чтобы старый текст не дублировался

                // Показываем только текущий обрабатываемый оригинал
                originalEl.innerText = blockToProcess;

                // Переводим
                let translatedBlock = await fetchTranslation(blockToProcess);
                if (translatedBlock) {
                    // Показываем только текущий перевод
                    translatedEl.innerText = translatedBlock;
                    // Озвучиваем строго этот свежий блок
                    playEdgeVoice(translatedBlock);
                }
            }

            function startPushTimer() {
                const seconds = parseFloat(intervalInput.value) || 3;
                pushTimer = setInterval(() => {
                    processAndClearBlock();
                }, seconds * 1000);
            }

            intervalInput.addEventListener('change', () => {
                clearInterval(pushTimer);
                startPushTimer();
            });

            recognition.onstart = () => {
                statusEl.innerText = "🎤 Синхронный перевод запущен...";
            };

            // Слушаем поток, но при перезапуске сессии браузером берем только свежий кусок
            recognition.onresult = (event) => {
                let currentStreamText = "";
                // Берем только самые последние результаты текущего отрезка
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    currentStreamText += event.results[i][0].transcript + " ";
                }
                rawSpeechBuffer = currentStreamText;
                
                // Подсвечиваем в реальном времени то, что накопилось за текущие секунды до отправки
                originalEl.innerText = rawSpeechBuffer;
            };

            recognition.onerror = (e) => {
                statusEl.innerText = "Ошибка распознавания: " + e.error;
            };

            recognition.onend = () => { 
                setTimeout(() => { 
                    try { recognition.start(); } catch(e) {} 
                }, 300); 
            };
            
            const savedDir = localStorage.getItem('selectedDirection') || 'en-ru';
            langSelect.value = savedDir;
            updateUI();
            recognition.start();
            startPushTimer();
        }
    </script>
</body>
</html>
