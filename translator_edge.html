<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Real-time Sync Translation</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; max-width: 800px; margin: auto; }
        .box { background: white; padding: 15px; border: 1px solid #ccc; border-radius: 5px; margin-top: 10px; height: 60px; overflow: hidden; font-size: 1.2em; white-space: pre-wrap; line-height: 1.5; }
        #original { color: #333; }
        #translated { color: #1a73e8; font-weight: bold; }
        .controls { margin-top: 15px; margin-bottom: 15px; background: #eee; padding: 15px; border-radius: 8px; }
        .controls div { margin-bottom: 10px; }
        .status { color: gray; font-style: italic; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Синхронный перевод интервью</h2>
    
    <div class="controls">
        <div>
            <label for="langSelect">Направление:</label>
            <select id="langSelect">
                <option value="en-ru">Английский ➔ Русский (озвучка RU)</option>
                <option value="ru-en">Русский ➔ Английский (озвучка EN)</option>
                <option value="uk-en">Украинский ➔ Английский (озвучка EN)</option>
                <option value="en-uk">Английский ➔ Украинский (озвучка UK)</option>
            </select>
        </div>
        <div>
            <label for="intervalInput">Интервал блока (сек): </label>
            <input type="number" id="intervalInput" value="3" step="0.5" min="1" max="10" style="width: 60px;">
        </div>
        <div>
            <label for="speedInput">Скорость озвучки: </label>
            <input type="range" id="speedRange" value="1.3" step="0.1" min="1.0" max="2.5" style="width: 120px; vertical-align: middle;">
            <input type="number" id="speedInput" value="1.3" step="0.1" min="1.0" max="2.5" style="width: 60px;">x
        </div>
        <div>
            <label>
                <input type="checkbox" id="voiceToggle" checked> Живая озвучка Edge
            </label>
        </div>
    </div>

    <p class="status" id="status">Запуск...</p>

    <h3 id="orig-title">Текущий оригинал:</h3>
    <div id="original" class="box"></div>

    <h3 id="trans-title">Текущий перевод:</h3>
    <div id="translated" class="box"></div>

    <script>
        const langSelect = document.getElementById('langSelect');
        const intervalInput = document.getElementById('intervalInput');
        const speedInput = document.getElementById('speedInput');
        const speedRange = document.getElementById('speedRange');
        const voiceToggle = document.getElementById('voiceToggle');
        const statusEl = document.getElementById('status');
        const originalEl = document.getElementById('original');
        const translatedEl = document.getElementById('translated');
        const origTitle = document.getElementById('orig-title');
        const transTitle = document.getElementById('trans-title');

        let currentChunkText = "";
        let recognition = null;
        let cycleTimer = null;
        let currentAudio = null;

        // Синхронизация ползунка и числового поля скорости
        speedRange.addEventListener('input', () => { speedInput.value = speedRange.value; });
        speedInput.addEventListener('input', () => { speedRange.value = speedInput.value; });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusEl.innerText = "Ошибка: Ваш браузер не поддерживает распознавание речи. Используйте Google Chrome.";
        } else {
            function getLangs() {
                const val = langSelect.value;
                const parts = val.split('-');
                return { source: parts[0], target: parts[1] };
            }

            function updateUI() {
                const { source, target } = getLangs();
                const map = { en: 'EN', ru: 'RU', uk: 'UK' };
                origTitle.innerText = `Текущий оригинал (${map[source]}):`;
                transTitle.innerText = `Текущий перевод (${map[target]}):`;
            }

            async function fetchTranslation(text) {
                if (!text.trim()) return "";
                const { source, target } = getLangs();
                try {
                    let response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${source}&tl=${target}&dt=t&q=${encodeURIComponent(text)}`);
                    let data = await response.json();
                    if (data && data[0]) {
                        return data[0].map(item => item[0]).join('');
                    }
                } catch (e) {
                    console.error("Ошибка перевода:", e);
                }
                return "";
            }

            async function playEdgeVoice(text) {
                if (!voiceToggle.checked || !text.trim()) return;
                const { target } = getLangs();
                
                // Берем текущее значение скорости из поля прямо в момент озвучки (реальное время!)
                const speed = parseFloat(speedInput.value) || 1.3;
                const ratePercent = Math.round((speed - 1.0) * 100);
                const rateStr = (ratePercent >= 0 ? `+${ratePercent}%` : `${ratePercent}%`);

                try {
                    let response = await fetch(`http://127.0.0.1:8000/speak?text=${encodeURIComponent(text)}&lang=${target}&rate=${rateStr}`);
                    if (response.ok) {
                        let blob = await response.blob();
                        let audioUrl = URL.createObjectURL(blob);
                        
                        if (currentAudio) {
                            currentAudio.pause();
                            currentAudio = null;
                        }

                        currentAudio = new Audio(audioUrl);
                        currentAudio.play().catch(e => console.log(e));
                    }
                } catch (e) {
                    console.error("Ошибка связи с Edge-TTS сервером:", e);
                }
            }

            async function processAndFlush() {
                if (recognition) {
                    try { recognition.stop(); } catch(e) {}
                }

                let textToSend = currentChunkText.trim();
                currentChunkText = ""; 

                if (textToSend) {
                    originalEl.innerText = textToSend;
                    let translated = await fetchTranslation(textToSend);
                    if (translated) {
                        translatedEl.innerText = translated;
                        playEdgeVoice(translated);
                    }
                } else {
                    originalEl.innerText = "";
                    translatedEl.innerText = "";
                }

                startRecognition();
            }

            function startRecognition() {
                try {
                    recognition = new SpeechRecognition();
                    recognition.continuous = true;
                    recognition.interimResults = true;
                    
                    const { source } = getLangs();
                    const speechLangMap = { en: 'en-US', ru: 'ru-RU', uk: 'uk-UA' };
                    recognition.lang = speechLangMap[source];

                    recognition.onresult = (event) => {
                        let interim = "";
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            interim += event.results[i][0].transcript + " ";
                        }
                        currentChunkText = interim;
                        originalEl.innerText = currentChunkText; 
                    };

                    recognition.onerror = () => {};
                    
                    recognition.onend = () => {
                        if (cycleTimer) {
                            try { recognition.start(); } catch(e) {}
                        }
                    };

                    recognition.start();
                } catch(e) {}
            }

            function resetAllCycles() {
                clearInterval(cycleTimer);
                if (recognition) { try { recognition.stop(); } catch(e) {} }
                if (currentAudio) { currentAudio.pause(); currentAudio = null; }
                
                currentChunkText = "";
                originalEl.innerText = "";
                translatedEl.innerText = "";

                const seconds = parseFloat(intervalInput.value) || 3;
                startRecognition();
                
                cycleTimer = setInterval(() => {
                    processAndFlush();
                }, seconds * 1000);
            }

            langSelect.addEventListener('change', () => {
                updateUI();
                localStorage.setItem('selectedDirection', langSelect.value);
                resetAllCycles();
            });

            intervalInput.addEventListener('change', () => { resetAllCycles(); });

            const savedDir = localStorage.getItem('selectedDirection') || 'en-ru';
            langSelect.value = savedDir;
            updateUI();
            statusEl.innerText = "🎤 Синхронный режим активирован...";
            resetAllCycles();
        }
    </script>
</body>
</html>
